<section id="homeowner-form">
  <h2>Homeowner Application</h2>
  <p>Apply to see if you qualify for mortgage payment assistance.</p>

  <form action="https://formspree.io/f/YOUR_HOMEOWNER_FORM_ID" method="POST">

    <label>Full Name</label>
    <input type="text" name="name" required>

    <label>Email Address</label>
    <input type="email" name="email" required>

    <label>Phone Number</label>
    <input type="text" name="phone" required>

    <label>Property Address</label>
    <input type="text" name="address" required>

    <label>Current Mortgage Lender</label>
    <input type="text" name="lender">

    <label>Monthly Mortgage Payment</label>
    <input type="text" name="payment">

    <label>How many months behind are you?</label>
    <input type="text" name="arrears">

    <label>Reason for Assistance</label>
    <textarea name="reason"></textarea>

    <button type="submit">Submit Application</button>
  </form>
</section>
<section id="investor-form">
  <h2>Investor Inquiry</h2>
  <p>Join the Investor Waitlist for Canada’s first Home-Rescue Equity Fund.</p>

  <form action="https://formspree.io/f/YOUR_INVESTOR_FORM_ID" method="POST">

    <label>Full Name</label>
    <input type="text" name="name" required>

    <label>Email Address</label>
    <input type="email" name="email" required>

    <label>Phone Number</label>
    <input type="text" name="phone">

    <label>Investment Range</label>
    <select name="investment-range">
      <option value="10-25k">$10,000 – $25,000</option>
      <option value="25-50k">$25,000 – $50,000</option>
      <option value="50-100k">$50,000 – $100,000</option>
      <option value="100k+">$100,000+</option>
    </select>

    <label>Preferred Return Type</label>
    <select name="return-type">
      <option value="fixed">8–12% Fixed Return</option>
      <option value="equity">Equity Appreciation Share</option>
      <option value="undecided">Not Sure Yet</option>
    </select>

    <button type="submit">Join Waitlist</button>
  </form>
</section>
<section id="broker-form">
  <h2>Broker Partnership Form</h2>
  <p>Partner with StayHome Capital to help clients avoid foreclosure.</p>

  <form action="https://formspree.io/f/YOUR_BROKER_FORM_ID" method="POST">

    <label>Broker Name</label>
    <input type="text" name="name" required>

    <label>Brokerage Name</label>
    <input type="text" name="brokerage">

    <label>Email Address</label>
    <input type="email" name="email" required>

    <label>Phone Number</label>
    <input type="text" name="phone">

    <label>Client Situation</label>
    <textarea name="client-details"></textarea>

    <button type="submit">Submit Referral</button>
  </form>
</section>
