<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayHome Capital</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #0f172a;
    }
    nav {
      position: sticky;
      top: 0;
      background: #0b1120;
      padding: 12px 20px;
      z-index: 100;
      display: flex;
      justify-content: center;
      gap: 20px;
      border-bottom: 1px solid #111827;
    }
    nav a {
      color: #e5e7eb;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    nav a:hover {
      color: #cbd5e1;
    }
    section {
      padding: 40px;
      max-width: 650px;
      margin: 40px auto;
      background: #f9fafb;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 15px 50px rgba(15, 23, 42, 0.08);
    }
    h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #0b1120;
      letter-spacing: -0.02em;
    }
    p {
      text-align: center;
      margin-bottom: 20px;
      color: #334155;
      line-height: 1.6;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    label {
      font-weight: 600;
      color: #0f172a;
    }
    input, select, textarea {
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: white;
      color: #0f172a;
    }
    button {
      padding: 12px;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
    }
    .status {
      min-height: 18px;
      font-size: 14px;
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <!-- SIMPLE NAVBAR TO JUMP TO EACH FORM -->
  <nav>
    <a href="#homeowner-form">Homeowner Apply</a>
    <a href="#investor-form">Investor</a>
    <a href="#broker-form">Broker</a>
  </nav>

  <!-- HOMEOWNER APPLICATION FORM -->
  <section id="homeowner-form">
    <h2>Homeowner Application</h2>
    <p>
      Apply to see if you qualify for mortgage payment support.
    </p>

    <form action="https://formspree.io/f/xanrjvoa" method="POST" data-formspree data-redirect="thankyou.html">
      <input type="hidden" name="_redirect" value="thankyou.html">
      <label>Full Name</label>
      <input type="text" name="name" required>

      <label>Email Address</label>
      <input type="email" name="email" required>

      <label>Phone Number</label>
      <input type="text" name="phone" required>

      <label>Property Address</label>
      <input type="text" name="address" required>

      <label>Current Mortgage Lender</label>
      <input type="text" name="lender">

      <label>Monthly Mortgage Payment</label>
      <input type="text" name="payment">

      <label>How many months behind?</label>
      <input type="text" name="arrears">

      <label>Reason for Assistance</label>
      <textarea name="reason" rows="4"></textarea>

      <div class="status" aria-live="polite"></div>
      <button type="submit" data-default-text="Submit Application" style="background:#1a73e8;">Submit Application</button>
    </form>
  </section>

  <!-- INVESTOR INQUIRY FORM -->
  <section id="investor-form">
    <h2>Investor Inquiry</h2>
    <p>
      Join the investor waitlist for Canada’s Home-Rescue Equity Fund.
    </p>

    <form action="https://formspree.io/f/mjknrlwa" method="POST" data-formspree data-redirect="thankyou.html">
      <input type="hidden" name="_redirect" value="thankyou.html">
      <label>Full Name</label>
      <input type="text" name="name" required>

      <label>Email Address</label>
      <input type="email" name="email" required>

      <label>Phone Number (optional)</label>
      <input type="text" name="phone">

      <label>Investment Range</label>
      <select name="investment_range">
        <option value="10-25k">$10,000 – $25,000</option>
        <option value="25-50k">$25,000 – $50,000</option>
        <option value="50-100k">$50,000 – $100,000</option>
        <option value="100k+">$100,000+</option>
      </select>

      <label>Preferred Return Type</label>
      <select name="return_type">
        <option value="fixed">8–12% Fixed Annual Return</option>
        <option value="equity">Home Appreciation Share</option>
        <option value="not_sure">Not sure yet</option>
      </select>

      <label>Anything else we should know?</label>
      <textarea name="notes" rows="4"></textarea>

      <div class="status" aria-live="polite"></div>
      <button type="submit" data-default-text="Join Investor Waitlist" style="background:#16a34a;">Join Investor Waitlist</button>
    </form>
  </section>

  <!-- MORTGAGE BROKER PARTNERSHIP FORM -->
  <section id="broker-form">
    <h2>Broker Partnership Form</h2>
    <p>
      Partner with StayHome Capital to help clients in mortgage distress.
    </p>

    <form action="https://formspree.io/f/mvgvonbj" method="POST" data-formspree data-redirect="thankyou.html">
      <input type="hidden" name="_redirect" value="thankyou.html">
      <label>Broker Name</label>
      <input type="text" name="name" required>

      <label>Brokerage Name</label>
      <input type="text" name="brokerage">

      <label>Email Address</label>
      <input type="email" name="email" required>

      <label>Phone Number</label>
      <input type="text" name="phone">

      <label>Client Situation (short summary)</label>
      <textarea name="client_details" rows="4"></textarea>

      <div class="status" aria-live="polite"></div>
      <button type="submit" data-default-text="Submit Referral" style="background:#f59e0b;">Submit Referral</button>
    </form>
  </section>

  <script>
    // Submit forms through Formspree with helpful error messaging and a reliable redirect
    document.addEventListener('DOMContentLoaded', () => {
      const forms = document.querySelectorAll('form[data-formspree]');

      forms.forEach((form) => {
        let onSubmit;

        const submitWithNative = () => {
          form.removeEventListener('submit', onSubmit);
          form.submit();
        };

        onSubmit = async (event) => {
          if (!window.fetch) return;
          event.preventDefault();

          const statusEl = form.querySelector('.status');
          const submitButton = form.querySelector('button[type="submit"]');
          const defaultLabel = submitButton.dataset.defaultText || submitButton.textContent;
          const redirectTarget = form.dataset.redirect || 'thankyou.html';

          statusEl.textContent = '';
          submitButton.disabled = true;
          submitButton.textContent = 'Submitting...';

          try {
            const response = await fetch(form.action, {
              method: 'POST',
              body: new FormData(form),
              headers: { 'Accept': 'application/json' },
            });

            if (response.ok) {
              form.reset();
              window.location.href = redirectTarget;
              return;
            }

            const data = await response.json().catch(() => ({}));
            const errors = Array.isArray(data?.errors)
              ? data.errors.map((err) => err.message).join(' ')
              : null;

            if (errors || data?.error) {
              statusEl.textContent = errors || data.error;
              return;
            }

            submitWithNative();
          } catch (error) {
            submitWithNative();
          } finally {
            submitButton.disabled = false;
            submitButton.textContent = defaultLabel;
          }
        };

        form.addEventListener('submit', onSubmit);
      });
    });
  </script>
</body>
</html>
