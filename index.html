<!-- HOMEOWNER APPLICATION FORM -->
<section id="homeowner-form" style="padding: 40px; max-width: 600px; margin: 40px auto; background:#f9fafb; border-radius:10px; border:1px solid #e5e7eb;">
  <h2 style="text-align:center; margin-bottom:10px;">Homeowner Application</h2>
  <p style="text-align:center; margin-bottom:20px;">
    Apply to see if you qualify for mortgage payment support.
  </p>

  <form action="https://formspree.io/f/xanrjvoa" method="POST" style="display:flex; flex-direction:column; gap:15px;">
    <!-- redirect to thankyou page after submit -->
    <input type="hidden" name="_redirect" value="https://stayhomecapital.com/thankyou.html">

    <label>Full Name</label>
    <input type="text" name="name" required style="padding:10px; border:1px solid #ccc; border-radius:6px;">

    <label>Email Address</label>
    <input type="email" name="email" required style="padding:10px; border:1px solid #ccc; border-radius:6px;">

    <label>Phone Number</label>
    <input type="text" name="phone" required style="padding:10px; border:1px solid #ccc; border-radius:6px;">

    <label>Property Address</label>
    <input type="text" name="address" required style="padding:10px; border:1px solid #ccc; border-radius:6px;">

    <label>Current Mortgage Lender</label>
    <input type="text" name="lender" style="padding:10px; border:1px solid #ccc; border-radius:6px;">

    <label>Monthly Mortgage Payment</label>
    <input type="text" name="payment" style="padding:10px; border:1px solid #ccc; border-radius:6px;">

    <label>How many months behind?</label>
    <input type="text" name="arrears" style="padding:10px; border:1px solid #ccc; border-radius:6px;">

    <label>Reason for Assistance</label>
    <textarea name="reason" rows="4" style="padding:10px; border:1px solid #ccc; border-radius:6px;"></textarea>

    <button type="submit" style="padding:12px; background:#1a73e8; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600;">
      Submit Application
    </button>
  </form>
</section>

<!-- INVESTOR INQUIRY FORM -->
<section id="investor-form" style="padding: 40px; max-width: 600px; margin: 40px auto; background:#f9fafb; border-radius:10px; border:1px solid #e5e7eb;">
  <h2 style="text-align:center; margin-bottom:10px;">Investor Inquiry</h2>
  <p style="text-align:center; margin-bottom:20px;">
    Join the investor waitlist for Canada’s Home-Rescue Equity Fund.
  </p>

  <form action="https://formspree.io/f/mjknrlwa" method="POST" style="display:flex; flex-direction:column; gap:15px;">
    <!-- redirect to thankyou page after submit -->
    <input type="hidden" name="_redirect" value="https://stayhomecapital.com/thankyou.html">

    <label>Full Name</label>
    <input type="text" name="name" required style="padding:10px; border:1px solid #ccc; border-radius:6px;">

    <label>Email Address</label>
    <input type="email" name="email" required style="padding:10px; border:1px solid #ccc; border-radius:6px;">

    <label>Phone Number (optional)</label>
    <input type="text" name="phone" style="padding:10px; border:1px solid #ccc; border-radius:6px;">

    <label>Investment Range</label>
    <select name="investment_range" style="padding:10px; border:1px solid #ccc; border-radius:6px;">
      <option value="10-25k">$10,000 – $25,000</option>
      <option value="25-50k">$25,000 – $50,000</option>
      <option value="50-100k">$50,000 – $100,000</option>
      <option value="100k+">$100,000+</option>
    </select>

    <label>Preferred Return Type</label>
    <select name="return_type" style="padding:10px; border:1px solid #ccc; border-radius:6px;">
      <option value="fixed">8–12% Fixed Annual Return</option>
      <option value="equity">Home Appreciation Share</option>
      <option value="not_sure">Not sure yet</option>
    </select>

    <label>Anything else we should know?</label>
    <textarea name="notes" rows="4" style="padding:10px; border:1px solid #ccc; border-radius:6px;"></textarea>

    <button type="submit" style="padding:12px; background:#16a34a; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600;">
      Join Investor Waitlist
    </button>
  </form>
</section>

<!-- MORTGAGE BROKER PARTNERSHIP FORM -->
<section id="broker-form" style="padding: 40px; max-width: 600px; margin: 40px auto; background:#f9fafb; border-radius:10px; border:1px solid #e5e7eb;">
  <h2 style="text-align:center; margin-bottom:10px;">Broker Partnership Form</h2>
  <p style="text-align:center; margin-bottom:20px;">
    Partner with StayHome Capital to help clients in mortgage distress.
  </p>

  <form action="https://formspree.io/f/mvgvonbj" method="POST" style="display:flex; flex-direction:column; gap:15px;">
    <!-- redirect to thankyou page after submit -->
    <input type="hidden" name="_redirect" value="https://stayhomecapital.com/thankyou.html">

    <label>Broker Name</label>
    <input type="text" name="name" required style="padding:10px; border:1px solid #ccc; border-radius:6px;">

    <label>Brokerage Name</label>
    <input type="text" name="brokerage" style="padding:10px; border:1px solid #ccc; border-radius:6px;">

    <label>Email Address</label>
    <input type="email" name="email" required style="padding:10px; border:1px solid #ccc; border-radius:6px;">

    <label>Phone Number</label>
    <input type="text" name="phone" style="padding:10px; border:1px solid #ccc; border-radius:6px;">

    <label>Client Situation (short summary)</label>
    <textarea name="client_details" rows="4" style="padding:10px; border:1px solid #ccc; border-radius:6px;"></textarea>

    <button type="submit" style="padding:12px; background:#f59e0b; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600;">
      Submit Referral
    </button>
  </form>
</section>
